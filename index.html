<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>読解ステップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/ui.css">
<style>
  .plist .pt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plist .ps { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plist a > span:nth-child(2) { min-width: 0; }
  .pane .stage-body { margin: 0; }
</style>
</head>
<body class="ui-page">
<header class="topbar">
  <a class="logo" href="index.html">読解ステップ</a>
  <span class="crumb"><span class="k kid">小</span>小学生の読みとり → <span class="k intro">入</span>文章に慣れる → <span class="k learn">本</span>解き方を学ぶ（ステージ０〜７） → <span class="k exam">試</span>入試演習</span>
  <span class="tip">印刷：A4横・余白なし・倍率100％・背景のグラフィックをオン</span>
</header>
<div class="app">
  <nav class="rail" aria-label="段階"><ol id="rail"></ol></nav>
  <main class="pane" id="pane"></main>
</div>

<script src="assets/js/yomi.js"></script>
<script src="data/stages.js"></script>
<script src="data/stage0.js"></script>
<script src="data/stage1.js"></script>
<script src="data/stage2.js"></script>
<script src="data/stage3.js"></script>
<script src="data/stage4.js"></script>
<script src="data/stage5.js"></script>
<script src="data/stage6.js"></script>
<script src="data/stage7.js"></script>
<script src="data/diag.js"></script>
<script src="data/diag-chu.js"></script>
<script src="data/diag-sho.js"></script>
<script src="data/sakubun.js"></script>
<script src="data/sakubun2.js"></script>
<script src="data/koten-bun.js"></script>
<script src="data/koten-doku.js"></script>
<script src="data/koten-kan.js"></script>
<script src="data/bunpo-1.js"></script>
<script src="data/bunpo-2.js"></script>
<script src="data/bunpo-3.js"></script>
<script src="data/bunpo-4.js"></script>
<script src="data/bank.js"></script>
<script src="data/bank-plus.js"></script>
<script src="data/bank-plus2.js"></script>
<script src="data/kids.js"></script>
<script src="data/bank-kids.js"></script>
<script src="data/write.js"></script>
<script src="assets/js/practice.js"></script>
<script>
  const stages = Yomi.stages, D = Yomi.bank, P = Yomi.practice;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dots = (n) => `<span class="lv" title="${Yomi.LEVELS[n] || ''}">${[1, 2, 3].map((i) => `<i class="${i <= Math.min(n, 3) ? 'on' : ''}"></i>`).join('')}</span>`;
  const store = { get() { try { return localStorage.getItem('yomi-pane'); } catch (e) { return null; } }, set(v) { try { localStorage.setItem('yomi-pane', v); } catch (e) {} } };
  const enc = encodeURIComponent;

  /* 左の一覧：入門 → ステージ０〜７ → 入試演習 */
  const K = Yomi.kids;
  const panes = [
    { key: 'diag', n: '診', cls: 'diag', name: '診断テスト', ct: 'はじめ・中間・まとめ' },
    ...K.bands.map((b) => ({ key: 'kids' + b.key, n: b.badge, cls: 'kid', name: b.title, ct: `${b.name}・${K.sets.filter((x) => x.band === b.key).length}題`, b })),
    { key: 'intro', n: '入', cls: 'intro', name: '文章に慣れる', ct: `入門・${D.problems.length}問` },
    ...stages.map((s) => ({ key: 'stage' + s.no, n: s.no, name: s.name, ct: `解き方 ${Yomi.byStage(s.no).length}枚`, s })),
    { key: 'exam', n: '試', cls: 'exam', name: '入試演習', ct: `長文 ${D.bigsets.length}題` },
    { key: 'saku', n: '作', cls: 'saku', name: '作文', ct: `条件作文 ${Yomi.byStage('S').length}枚` },
    { key: 'koten', n: '古', cls: 'koten', name: '古典', ct: `文法と読解 ${Yomi.byStage('K').length}枚` },
    { key: 'bunpo', n: '文', cls: 'bunpo', name: '文法', ct: `口語文法 ${Yomi.byStage('G').length}枚` },
  ];
  document.getElementById('rail').innerHTML = panes.map((p, i) =>
    `${i === 0 ? '<li class="sep">はじめに</li>' : ''}${i === 1 ? '<li class="sep">小学生</li>' : ''}${p.key === 'intro' ? '<li class="sep">中学生　入門</li>' : ''}${p.key === 'stage0' ? '<li class="sep">本編　解き方を学ぶ</li>' : ''}${p.key === 'exam' ? '<li class="sep">仕上げ</li>' : ''}` +
    `<li class="${p.cls || ''}"><button type="button" data-pane="${p.key}" title="${esc(p.name)}"><span class="n">${p.n}</span><span class="nm">${esc(p.name)}</span><span class="ct">${p.ct}</span></button></li>`).join('');

  function head(badge, cls, title, desc, key) {
    const i = panes.findIndex((p) => p.key === key), prev = panes[i - 1], next = panes[i + 1];
    return `<div class="pane-h"><div class="badge ${cls}">${badge}</div><div><h2>${title}</h2><p>${desc}</p></div>
      <div class="nav">${prev ? `<button class="btn" data-pane="${prev.key}">← ${prev.n}</button>` : ''}${next ? `<button class="btn" data-pane="${next.key}">${next.n} →</button>` : ''}</div></div>`;
  }

  /** 書く練習の一覧（band：'34'・'56'・'chu'） */
  const W = Yomi.write;
  function writeCard(band) {
    const mine = W.sets.filter((x) => x.band === band);
    if (!mine.length) return '';
    const u = (extra) => `bank.html?kind=write&band=${band}${extra}`;
    return `<section class="grp wgrp"><h3><span class="k write">書</span>書く練習　<a class="more" href="${u('')}">選ぶ →</a></h3><ul>${W.skills.filter((s) => mine.some((x) => x.skill === s.name)).map((s) => `
        <li><a href="${u('&skill=' + enc(s.name))}" title="${esc(s.desc)}"><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></a><span class="cnt">${mine.filter((x) => x.skill === s.name).length}題</span>
          <a class="mini" href="${u('&skill=' + enc(s.name) + '&mode=guided&auto=2')}">２題作る</a></li>`).join('')}</ul></section>`;
  }
  /** 技能別の練習（中学入門の小学生版） */
  function skillkCard(band) {
    const mine = (Yomi.bankKids || []).filter((x) => x.band === band);
    if (!mine.length) return '';
    const u = (extra) => `bank.html?kind=skillk&band=${band}${extra}`;
    const by = {};
    mine.forEach((x) => { by[x.skill] = (by[x.skill] || 0) + 1; });
    return `<section class="grp"><h3><span class="k kid">技</span>技能別の練習（中学「入門」の小学生版）　<a class="more" href="${u('')}">選ぶ →</a></h3>
      <p class="small">主語・指示語・接続語・理由・気持ち・要約など、技能ごとの短い問題です（${mine.length}問）。</p>
      <div class="acts row"><a class="act" href="${u('&mode=guided&auto=5')}">おまかせ５問<small>誘導つき</small></a><a class="act sub" href="${u('&auto=5')}">おまかせ５問<small>自分で</small></a></div>
      <p class="small">${Object.entries(by).map(([k, n]) => `<a href="${u('&skill=' + enc(k))}">${esc(k)}</a>（${n}）`).join('　')}</p></section>`;
  }

  function kidsHTML(b) {
    const mine = K.sets.filter((x) => x.band === b.key);
    const cnt = (sk) => mine.filter((x) => x.skill === sk).length;
    const u = (extra) => `bank.html?kind=kids&band=${b.key}${extra}`;
    const li = (s) => `
        <li><a href="${u('&skill=' + enc(s.name))}" title="${esc(s.desc)}"><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></a><span class="cnt">${cnt(s.name)}題</span>
          <a class="mini" href="${u('&skill=' + enc(s.name) + '&mode=guided&auto=3')}">３題作る</a></li>`;
    const half = Math.ceil(b.skills.length / 2);
    const g = { '12': ['一年生', '一〜二年生', '二年生'], '34': ['三年生', '四年生', '四年生・長め'], '56': ['五年生', '六年生', '六年生・長め'] }[b.key];
    const desc = {
      '12': '短いお話や説明の文を読んで、○をつけたり、ことばを書きぬいたりします。漢字はその学年までに習う字だけで、すべてにふりがなをつけ、大きな文字で印刷します。★は、ことばの間をあける「分かち書き」です。',
      '34': '物語と説明文を読んで、選んだり、書きぬいたり、短く書いたりします。★は三年生、★★・★★★は四年生向けで、その学年までに習う漢字だけを使い、その学年で習う漢字にはふりがなをつけます。',
      '56': '物語と説明文を読んで、選ぶ・ぬき出す・字数を決めて書く問題に答えます。★は五年生、★★・★★★は六年生向けで、その学年までに習う漢字だけを使い、その学年で習う漢字にはふりがなをつけます。中学の勉強への橋わたしです。',
    }[b.key];
    const i = K.bands.indexOf(b), nextB = K.bands[i + 1];
    return `<div class="kidpane">` + head(b.badge, 'kid', `${esc(b.title)}（${esc(b.name)}生）`, desc, 'kids' + b.key) + `
      <div class="acts row">
        <a class="act" href="${u('&level=1&mode=guided&auto=3')}">★を３題<small>${g[0]}・ヒントつき</small></a>
        <a class="act" href="${u('&level=2&mode=guided&auto=3')}">★★を３題<small>${g[1]}</small></a>
        <a class="act" href="${u('&level=3&auto=3')}">★★★を３題<small>${g[2]}</small></a>
        <a class="act sub" href="${u('')}">問題を見て選ぶ<small>→</small></a>
      </div>
      <div class="groups">
        <section class="grp"><h3>${{ '12': 'お話を読む', '34': 'お話を読む', '56': '物語と理由' }[b.key]}</h3><ul>${b.skills.slice(0, half).map(li).join('')}</ul></section>
        <section class="grp"><h3>${{ '12': '気持ち・わけ・ことば', '34': 'わけ・ことば・説明文', '56': '説明文とことば' }[b.key]}</h3><ul>${b.skills.slice(half).map(li).join('')}</ul></section>
      </div>
      ${b.key !== '12' ? `<div class="groups more2">${skillkCard(b.key)}${writeCard(b.key)}</div>` : ''}
      <p class="kidnote">${nextB ? `次は「${esc(nextB.title)}」へ。` : '次は中学生向けの「入門　文章に慣れる」へ。'}</p></div>`;
  }

  function diagHTML() {
    // ids：はじめ・中間・まとめ（同じ区分・配点なので、点数で伸びを比べられる）
    const card = (ids, who, how) => {
      const links = ids.map((id, k) => {
        const p = Yomi.find(id);
        return p ? `<a class="act${k ? ' sub' : ''}" href="print.html?id=${id}">${['はじめ', '中間', 'まとめ'][k]}（${id}）<small>問題・解答・解説</small></a>` : '';
      }).join('');
      return `<section class="grp dcard"><h3>${esc(who)}</h3>
        <p class="acts">${links}</p>
        <p class="small">${how}　はじめ・中間・まとめは区分と配点が同じなので、得点をくらべて伸びを確かめられます。</p></section>`;
    };
    return head('診', 'diag', '診断テスト　どこから始めるかを決める',
      '新しい生徒や、学期のはじめに使います。解き終えたら解説ページの表に区分ごとの得点を書き、合計点で始める場所を、半分未満の区分で重点的に練習するところを決めます。', 'diag') + `
      <div class="groups">
        ${card(['D-1', 'D-3', 'D-5'], '中学生用（約三十分・百点）', '十問。区分（本文照合・具体と抽象・対比・理由・指示語と接続語・要旨・心情・条件つき記述）ごとに、弱いところのステージが分かります。合計点で「入門／ステージ０から／弱い区分から／入試演習」を決めます。')}
        ${card(['D-2', 'D-4', 'D-6'], '小学生用（小３〜６・約二十分・百点）', '八問。漢字は四年生まで（三・四年の漢字にふりがな）。合計点で「小１・２／小３・４／小５・６／中学入門」のどこから始めるかを決めます。')}
      </div>`;
  }

  function introHTML() {
    const groups = P.skillGroups().map((g) => `
      <section class="grp"><h3>${esc(g.name)}</h3><ul>${g.skills.map((s) => `
        <li><a href="bank.html?skill=${enc(s.name)}" title="${esc(s.desc)}"><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></a><span class="cnt">${s.count}問</span>
          <a class="mini" href="bank.html?skill=${enc(s.name)}&mode=guided&auto=4" title="${esc(s.name)}を４問、誘導つきで作る">４問作る</a></li>`).join('')}</ul></section>`).join('');
    return head('入', 'intro', '入門　文章に慣れる',
      '中学生向けの入門です。やさしく短い文章で、技能ごとに読むことに慣れる練習をします。本編（ステージ０〜７）に入る前の準備や、読むのが苦手な人のくり返し練習に使います。', 'intro') + `
      <div class="acts row">
        <a class="act" href="bank.html?level=12&mode=guided&auto=5">おまかせ５問<small>★１・２・誘導つき</small></a>
        <a class="act" href="bank.html?level=34&auto=5">おまかせ５問<small>★３・４・自力で</small></a>
        <a class="act sub" href="bank.html?kind=kaizen">答案を直す練習<small>${D.kaizen.length}問</small></a>
        <a class="act sub" href="bank.html">問題を見て選ぶ<small>→</small></a>
      </div>
      <div class="groups">${groups}</div>
      <div class="groups more2">${writeCard('chu')}</div>`;
  }

  function stageHTML(s) {
    const prints = Yomi.byStage(s.no);
    const rows = prints.map((p) => `
      <li><a href="print.html?id=${p.id}" title="${esc(p.sub || '')}">
        <span class="pid">${p.id}</span>
        <span><span class="pt">${p.title}</span><span class="ps">${p.sub || ''}</span></span>
        ${p.score ? '<span class="cnt">配点つき</span>' : dots(p.level)}
      </a></li>`).join('');
    const sk = P.skillsForStage(s.no);
    const warm = sk.length ? `<p class="warm"><span class="k intro">入</span>読むのに慣れていないときは、先に入門で：${sk.map((n) => `<a href="bank.html?skill=${enc(n)}">${esc(n)}</a>`).join('・')}</p>` : '';
    return head(s.label, '', `ステージ${s.label}　${s.name}`, s.desc, 'stage' + s.no) + `
      <div class="card">
        <div class="col-h"><span class="k learn">本</span>解き方を学ぶプリント<span class="cnt">${prints.length}枚</span><a class="more" href="print.html?stage=${s.no}">まとめて印刷 →</a></div>
        <ul class="plist cols">${rows}</ul>
        ${warm}
      </div>`;
  }

  function examHTML() {
    const order = ['標準', '発展', '長文・入試接続', '長文・入試実戦', '古典入門', '古典実戦'];
    const sets = [...D.bigsets].sort((a, b) => order.indexOf(a.level) - order.indexOf(b.level));
    const rows = sets.map((b) => `
      <li><a href="bank.html?kind=big&pick=${b.id}" title="この大問のプリントを作る">
        <span class="pid">${esc(b.genre.replace('文', ''))}</span>
        <span><span class="pt">${esc(b.title.replace(/^(物語|説明)文?「(.*)」$/, '$2'))}</span><span class="ps">${esc(b.level)}・${b.passage.length}字・${b.questions.length}問</span></span>
      </a></li>`).join('');
    return head('試', 'exam', '入試演習　長文の大問',
      '入試と同じ形式の長文問題です。記述・記号選択・抜き出しをまぜた大問で、各問に配点（合計100点）と採点基準・解説がついています。ステージ０〜７で身につけた解き方を、誘導なしで使います。', 'exam') + `
      <div class="card">
        <div class="col-h"><span class="k exam">試</span>大問を選んでプリントを作る<span class="cnt">${sets.length}題</span><a class="more" href="bank.html?kind=big">まとめて選ぶ →</a></div>
        <ul class="plist cols">${rows}</ul>
      </div>`;
  }

  function sakuHTML() {
    const prints = Yomi.byStage('S');
    const rows = prints.map((p) => `
      <li><a href="print.html?id=${p.id}" title="${esc(p.sub || '')}">
        <span class="pid">${p.id}</span>
        <span><span class="pt">${p.title}</span><span class="ps">${p.sub || ''}</span></span>
        ${p.score ? '<span class="cnt">配点つき</span>' : dots(p.level)}
      </a></li>`).join('');
    return head('作', 'saku', '作文　入試の条件作文',
      '原稿用紙の使い方と作文の型から始めて、条件作文・資料を読んで書く作文・推敲までを練習します。最後のプリントは入試形式の模擬で、採点基準がついています。', 'saku') + `
      <div class="card">
        <div class="col-h"><span class="k saku">作</span>作文のプリント<span class="cnt">${prints.length}枚</span></div>
        <ul class="plist cols">${rows}</ul>
      </div>`;
  }

  function kotenHTML() {
    const prints = Yomi.byStage('K');
    const rows = prints.map((p) => `
      <li><a href="print.html?id=${p.id}" title="${esc(p.sub || '')}">
        <span class="pid">${p.id}</span>
        <span><span class="pt">${p.title}</span><span class="ps">${p.sub || ''}</span></span>
        ${dots(p.level)}
      </a></li>`).join('');
    const big = D.bigsets.filter((b) => b.genre === '古文' || b.genre === '漢文');
    const brow = big.map((b) => `
      <li><a href="bank.html?kind=big&pick=${b.id}"><span class="pid">${esc(b.genre)}</span>
        <span><span class="pt">${esc(b.title)}</span><span class="ps">${esc(b.level)}・${b.questions.length}問</span></span></a></li>`).join('');
    return head('古', 'koten', '古典　文法と読解',
      '歴史的仮名遣い・古語・係り結び・主語・会話文から、現代語訳との対応・主題、和歌と俳句、漢文の返り点と漢詩までを、解き方のプリントで学びます。仕上げは古文・漢文の入試演習です。', 'koten') + `
      <div class="card">
        <div class="col-h"><span class="k koten">古</span>解き方を学ぶプリント<span class="cnt">${prints.length}枚</span><a class="more" href="print.html?stage=K">まとめて印刷 →</a></div>
        <ul class="plist cols">${rows}</ul>
      </div>
      <div class="card">
        <div class="col-h"><span class="k exam">試</span>古文・漢文の入試演習<span class="cnt">${big.length}題</span><a class="more" href="bank.html?kind=big">まとめて選ぶ →</a></div>
        <ul class="plist cols">${brow}</ul>
      </div>`;
  }

  function bunpoHTML() {
    const prints = Yomi.byStage('G');
    const rows = prints.map((p) => `
      <li><a href="print.html?id=${p.id}" title="${esc(p.sub || '')}">
        <span class="pid">${p.id}</span>
        <span><span class="pt">${p.title}</span><span class="ps">${p.sub || ''}</span></span>
        ${p.score ? '<span class="cnt">配点つき</span>' : dots(p.level)}
      </a></li>`).join('');
    return head('文', 'bunpo', '文法　口語文法',
      '言葉の単位・文節の関係から、品詞・活用・助詞と助動詞、まぎらわしい語の見分け方、敬語までを順に学びます。最後のプリントは入試形式のまとめテストです。', 'bunpo') + `
      <div class="card">
        <div class="col-h"><span class="k bunpo">文</span>文法のプリント<span class="cnt">${prints.length}枚</span><a class="more" href="print.html?stage=G">まとめて印刷 →</a></div>
        <ul class="plist cols">${rows}</ul>
      </div>`;
  }

  function show(key, push) {
    const p = panes.find((x) => x.key === key) || panes[0];
    document.getElementById('pane').innerHTML = p.key === 'diag' ? diagHTML() : p.b ? kidsHTML(p.b) : p.key === 'intro' ? introHTML() : p.key === 'exam' ? examHTML() : p.key === 'saku' ? sakuHTML() : p.key === 'koten' ? kotenHTML() : p.key === 'bunpo' ? bunpoHTML() : stageHTML(p.s);
    document.querySelectorAll('#rail button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.pane === p.key)));
    const cur = document.querySelector('#rail button[aria-current="true"]');
    if (cur && cur.scrollIntoView && window.innerWidth <= 760) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
    store.set(p.key);
    if (push) history.replaceState(null, '', '#' + p.key);
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-pane]');
    if (b) { show(b.dataset.pane, true); window.scrollTo(0, 0); }
  });
  const fromHash = /^#(diag|kids\d\d|kids|intro|exam|saku|koten|bunpo|stage\d)$/.exec(location.hash);
  const want = fromHash ? fromHash[1] : store.get() || 'intro';
  show(want === 'kids' ? 'kids12' : want, false);
</script>
</body>
</html>
