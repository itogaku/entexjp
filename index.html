<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>読解ステップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1f2328; --sub: #59636e; --line: #d1d9e0; --bg: #f6f8fa; --card: #fff; --accent: #2f6fd6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.7; }
  header { background: var(--ink); color: #fff; padding: 28px 16px 24px; }
  header .in, main { max-width: 980px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .04em; }
  header p { margin: 0; color: #c9d1d9; font-size: 14px; }
  main { padding: 20px 16px 60px; }
  .howto { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; font-size: 14px; margin-bottom: 20px; }
  .howto b { color: var(--accent); }
  .howto ol { margin: 6px 0 0; padding-left: 1.4em; }
  .stage { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .stage-h { display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .badge { flex: none; width: 46px; height: 46px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 20px; }
  .stage-h h2 { margin: 0; font-size: 18px; }
  .stage-h p { margin: 2px 0 0; color: var(--sub); font-size: 13px; }
  .stage-h .all { margin-left: auto; flex: none; font-size: 13px; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: 6px; padding: 4px 10px; white-space: nowrap; }
  ul { list-style: none; margin: 0; padding: 0; }
  li a { display: flex; gap: 12px; align-items: baseline; padding: 10px 18px; color: inherit; text-decoration: none; border-top: 1px solid #eef1f4; }
  li:first-child a { border-top: 0; }
  li a:hover { background: #f0f6ff; }
  .pid { flex: none; width: 2.6em; font-weight: 700; color: var(--accent); }
  .ptitle { font-weight: 700; }
  .psub { color: var(--sub); font-size: 13px; }
  .plv { margin-left: auto; flex: none; font-size: 12px; color: var(--sub); white-space: nowrap; }
  @media (max-width: 600px) {
    .stage-h { flex-wrap: wrap; }
    .stage-h .all { margin-left: 60px; }
    li a { flex-wrap: wrap; }
    .plv { margin-left: 3.6em; width: 100%; }
  }
</style>
</head>
<body>
<header><div class="in">
  <h1>読解ステップ</h1>
  <p>公立高校入試・国語　文章読解の「解く前に身につけたいこと」を、基礎から入試レベルまで段階的に練習するプリント集（中学３年生向け）</p>
</div></header>
<main>
  <div class="howto">
    <b>使い方</b>
    <ol>
      <li>プリントを選ぶと印刷ページが開きます。「問題」「解答（赤字入り）」「解説」を選んで印刷できます。</li>
      <li>印刷設定は <b>A4・横向き／余白なし／倍率100％／背景のグラフィックをオン</b>（Chrome・Edge 推奨）。</li>
      <li>ステージ０から順に進めると、ステージ７で入試形式の問題（誘導なし）に取り組めるように組み立てています。</li>
    </ol>
  </div>
  <div id="list"></div>
</main>
<script src="assets/js/yomi.js"></script>
<script src="data/stages.js"></script>
<script src="data/stage0.js"></script>
<script src="data/stage1.js"></script>
<script src="data/stage2.js"></script>
<script src="data/stage3.js"></script>
<script src="data/stage4.js"></script>
<script src="data/stage5.js"></script>
<script src="data/stage6.js"></script>
<script src="data/stage7.js"></script>
<script>
  const list = document.getElementById('list');
  list.innerHTML = Yomi.stages.map((s) => {
    const items = Yomi.byStage(s.no).map((p) => `
      <li><a href="print.html?id=${p.id}">
        <span class="pid">${p.id}</span>
        <span><span class="ptitle">${p.title}</span><br><span class="psub">${p.sub || ''}</span></span>
        <span class="plv">${Yomi.LEVELS[p.level] || ''}</span>
      </a></li>`).join('');
    return `<section class="stage">
      <div class="stage-h"><div class="badge">${s.label}</div>
        <div><h2>ステージ${s.label}　${s.name}</h2><p>${s.desc}</p></div>
        <a class="all" href="print.html?stage=${s.no}">まとめて印刷</a></div>
      <ul>${items}</ul></section>`;
  }).join('');
</script>
</body>
</html>
