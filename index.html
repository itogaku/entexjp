<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>読解ステップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/ui.css">
<style>
  .plist .pt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plist .ps { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plist a > span:nth-child(2) { min-width: 0; }
  .pane .stage-body { margin: 0; }
</style>
</head>
<body class="ui-page">
<header class="topbar">
  <a class="logo" href="index.html">読解ステップ</a>
  <span class="crumb"><span class="k learn">1</span>解き方を学ぶ → <span class="k practice">2</span>練習問題で定着 → ステージ７で入試形式へ</span>
  <span class="tip">印刷：A4横・余白なし・倍率100％・背景のグラフィックをオン</span>
</header>
<div class="app">
  <nav class="rail" aria-label="ステージ"><ol id="rail"></ol></nav>
  <main class="pane" id="pane"></main>
</div>

<script src="assets/js/yomi.js"></script>
<script src="data/stages.js"></script>
<script src="data/stage0.js"></script>
<script src="data/stage1.js"></script>
<script src="data/stage2.js"></script>
<script src="data/stage3.js"></script>
<script src="data/stage4.js"></script>
<script src="data/stage5.js"></script>
<script src="data/stage6.js"></script>
<script src="data/stage7.js"></script>
<script src="data/bank.js"></script>
<script src="data/bank-plus.js"></script>
<script src="assets/js/practice.js"></script>
<script>
  const stages = Yomi.stages;
  const dots = (n) => `<span class="lv" title="${Yomi.LEVELS[n] || ''}">${[1, 2, 3].map((i) => `<i class="${i <= Math.min(n, 3) ? 'on' : ''}"></i>`).join('')}</span>`;
  const store = { get() { try { return localStorage.getItem('yomi-stage'); } catch (e) { return null; } }, set(v) { try { localStorage.setItem('yomi-stage', v); } catch (e) {} } };

  document.getElementById('rail').innerHTML = stages.map((s) => {
    const n = Yomi.byStage(s.no).length, m = Yomi.practice.forStage(s.no).length;
    return `<li><button type="button" data-no="${s.no}" title="${s.name}"><span class="n">${s.no}</span><span class="nm">${s.name}</span><span class="ct">解き方 ${n}枚・練習 ${m}問</span></button></li>`;
  }).join('');

  function paneHTML(s) {
    const prints = Yomi.byStage(s.no);
    const rows = prints.map((p) => `
      <li><a href="print.html?id=${p.id}" title="${p.sub || ''}">
        <span class="pid">${p.id}</span>
        <span><span class="pt">${p.title}</span><span class="ps">${p.sub || ''}</span></span>
        ${p.score ? '<span class="cnt">配点つき</span>' : dots(p.level)}
      </a></li>`).join('');
    const sum = Yomi.practice.summary(s.no);
    const skills = Object.entries(sum.skills).sort((a, b) => b[1] - a[1]);
    const chips = skills.slice(0, 6).map(([k, n]) => `<span class="chip">${k} ${n}</span>`).join('') +
      (skills.length > 6 ? `<span class="chip">ほか${skills.length - 6}技能</span>` : '') +
      (sum.big ? `<span class="chip">長文 ${sum.big}題</span>` : '') + (sum.kaizen ? `<span class="chip">答案改善 ${sum.kaizen}</span>` : '');
    const base = `bank.html?stage=${s.no}`;
    const i = stages.indexOf(s), prev = stages[i - 1], next = stages[i + 1];
    return `<div class="pane-h"><div class="badge">${s.label}</div>
        <div><h2>ステージ${s.label}　${s.name}</h2><p>${s.desc}</p></div>
        <div class="nav">${prev ? `<button class="btn" data-no="${prev.no}">← ${prev.no}</button>` : ''}${next ? `<button class="btn" data-no="${next.no}">${next.no} →</button>` : ''}</div></div>
      <div class="stage-body">
        <div class="col">
          <div class="col-h"><span class="k learn">1</span>解き方を学ぶ<span class="cnt">${prints.length}枚</span></div>
          <ul class="plist">${rows}</ul>
          <a class="more" href="print.html?stage=${s.no}">まとめて印刷 →</a>
        </div>
        <div class="col practice">
          <div class="col-h"><span class="k practice">2</span>練習問題で定着<span class="cnt">${sum.total}問</span></div>
          <div class="chips">${chips}</div>
          <div class="acts">
            <a class="act" href="${base}&level=12&mode=guided&auto=5">基礎を5問<small>誘導つきで作る</small></a>
            <a class="act" href="${base}&level=34&auto=5">発展を5問<small>自力で解く</small></a>
            ${sum.big ? `<a class="act sub" href="${base}&kind=big">長文の問題を選ぶ<small>${sum.big}題</small></a>` : ''}
            ${sum.kaizen ? `<a class="act sub" href="${base}&kind=kaizen">答案改善を選ぶ<small>${sum.kaizen}問</small></a>` : ''}
            <a class="act sub" href="${base}">問題を見て選ぶ<small>→</small></a>
          </div>
        </div>
      </div>`;
  }

  function show(no, push) {
    const s = stages.find((x) => x.no === no) || stages[0];
    document.getElementById('pane').innerHTML = paneHTML(s);
    document.querySelectorAll('#rail button').forEach((b) => b.setAttribute('aria-current', String(Number(b.dataset.no) === s.no)));
    const cur = document.querySelector('#rail button[aria-current="true"]');
    if (cur && cur.scrollIntoView && window.innerWidth <= 760) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
    store.set(String(s.no));
    if (push) history.replaceState(null, '', '#stage' + s.no);
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-no]');
    if (b) { show(Number(b.dataset.no), true); window.scrollTo(0, 0); }
  });
  const fromHash = /^#stage(\d)$/.exec(location.hash);
  show(Number(fromHash ? fromHash[1] : store.get() || 0), false);
</script>
</body>
</html>
