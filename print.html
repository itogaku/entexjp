<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>読解プリント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/sheet.css">
</head>
<body>
<div class="toolbar">
  <div class="tb-row">
    <a href="index.html" class="tb-back">← ステージ一覧</a>
    <span class="title" id="tb-title">読解プリント</span>
    <a id="tb-prac" class="tb-prac" hidden>② このステージの練習問題 →</a>
  </div>
  <div class="tb-row tb-opts">
    <span class="tb-group" role="group" aria-label="印刷するもの">
      <label><input type="checkbox" id="opt-q" checked> 問題</label>
      <label><input type="checkbox" id="opt-a" checked> 解答（赤字）</label>
      <label><input type="checkbox" id="opt-k" checked> 解説</label>
    </span>
    <label class="tb-ng" title="ポイント・例題・ヒントを省き、まず自力で解く版を印刷します"><input type="checkbox" id="opt-ng"> 誘導なし（自力で解く版）</label>
    <button type="button" id="btn-print">印刷する</button>
  </div>
  <div class="note">印刷設定：A4・横向き／余白「なし」／倍率100％／「背景のグラフィック」をオン（Chrome・Edge 推奨）</div>
  <div class="warn" id="tb-warn" hidden></div>
</div>
<main class="sheets" id="sheets"></main>

<script src="assets/js/yomi.js"></script>
<script src="data/stages.js"></script>
<script src="data/stage0.js"></script>
<script src="data/stage1.js"></script>
<script src="data/stage2.js"></script>
<script src="data/stage3.js"></script>
<script src="data/stage4.js"></script>
<script src="data/stage5.js"></script>
<script src="data/stage6.js"></script>
<script src="data/stage7.js"></script>
<script src="assets/js/print.js"></script>
<script src="assets/js/fit.js"></script>
</body>
</html>
