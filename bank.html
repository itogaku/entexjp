<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習問題｜読解ステップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/sheet.css">
<link rel="stylesheet" href="assets/css/ui.css">
<style>
  /* 練習問題ページ */
  .stagebar { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .stagebar > label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); }
  .stagebar select { font-size: 16px; font-weight: 700; flex: 1 1 260px; }
  .stage-info { margin-top: 10px; font-size: 13px; color: var(--sub); }
  .stage-info p { margin: 0 0 6px; }
  .stage-info .learn-links { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .stage-info .learn-links b { color: var(--learn); margin-right: 4px; }
  .stage-info .learn-links a { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); text-decoration: none; white-space: nowrap; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }

  .tabs { display: flex; gap: 4px; padding: 3px; background: var(--soft); border-radius: 10px; margin-bottom: 12px; }
  .tabs button { flex: 1; font: inherit; font-size: 14px; padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--sub); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

  .filters { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-bottom: 10px; }
  .filters label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--sub); min-width: 0; }
  .filters label[hidden] { display: none; }

  .listbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--sub); padding: 8px 0; border-top: 1px solid var(--line); }
  .listbar #shown { margin-right: auto; font-weight: 700; color: var(--ink); }
  .listbar .rand { display: inline-flex; align-items: center; gap: 4px; }
  .listbar input[type="number"] { width: 4em; padding: 5px 6px; }

  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .item.on { background: var(--practice-soft); border-color: var(--practice); }
  .item .row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; cursor: pointer; }
  .item input { margin-top: 3px; width: 18px; height: 18px; flex: none; accent-color: var(--practice); }
  .item .qtext { font-size: 14px; min-width: 0; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 2px; }
  .item details { padding: 0 12px 8px 40px; font-size: 13px; }
  .item summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  .item .pv { white-space: pre-wrap; background: var(--bg); padding: 8px; border-radius: 6px; margin: 6px 0; max-height: 260px; overflow: auto; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--soft); color: var(--sub); }
  .tag.st { background: var(--ink); color: #fff; }
  .empty { padding: 24px; text-align: center; color: var(--sub); }

  .side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .side h2 { font-size: 14px; margin: 0 0 8px; }
  .countbox .count { font-size: 30px; font-weight: 700; color: var(--practice); font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; color: var(--sub); }
  .opt { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .opt label { display: flex; gap: 6px; align-items: flex-start; }
  .opt .name { flex-direction: column; gap: 2px; font-size: 12px; color: var(--sub); }
  .opt .modes { display: grid; gap: 6px; }
  .opt .modes label { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .opt .modes label:has(input:checked) { border-color: var(--practice); background: var(--practice-soft); }
  .opt .modes small { display: block; font-size: 11px; color: var(--sub); }
  .opt .outs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
  .opt .btn.primary { padding: 10px 12px; font-size: 15px; width: 100%; }

  /* スマホ：設定は一覧の上、作るボタンは画面下に固定 */
  #mbar { display: none; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; order: -1; }
    .side .countbox { display: none; }
    .opt .btn.primary, .opt .btn.primary + .small { display: none; }
    .filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .filters label:first-child { grid-column: 1 / -1; }
    .wrap { padding-bottom: 96px; }
    #mbar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      align-items: center; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--ink); color: #fff;
    }
    #mbar .c { font-size: 14px; flex: 1; }
    #mbar b { font-size: 20px; }
    #mbar .btn.primary { padding: 9px 16px; }
  }

  #out-bar { position: sticky; top: 0; z-index: 25; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 10px 16px; background: var(--ink); color: #fff; font-size: 14px; }
  #out-bar .btn { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  #out-bar .small { color: #c4ccd5; }
  #out-bar .warn { color: #ffb4b4; }
  #sheets:not(:empty) { background: #8a8f96; }
  @media print {
    .ui-shell, #out-bar, #mbar { display: none !important; }
    body.ui-page, #sheets:not(:empty) { background: none; }
  }
</style>
</head>
<body class="ui-page bank">
<div class="ui-shell">
  <header class="site-head"><div class="in">
    <a class="back" href="index.html">← ステージ一覧へ</a>
    <h1>練習問題</h1>
    <p>解き方を学んだあとに、同じ技能の問題をくり返し練習するページです。問題を選んで、プリントを作ります。</p>
  </div></header>
  <div class="wrap">
    <div class="stagebar">
      <label>ステージ<select id="f-stage"></select></label>
      <div class="stage-info" id="stage-info" hidden></div>
    </div>
    <div class="layout">
      <section class="panel">
        <div class="tabs" role="group" aria-label="問題の種類">
          <button type="button" data-kind="skill" aria-pressed="true">技能別の問題</button>
          <button type="button" data-kind="big" aria-pressed="false">長文の問題</button>
          <button type="button" data-kind="kaizen" aria-pressed="false">答案改善</button>
        </div>
        <div class="filters">
          <label id="f-skill-wrap">技能<select id="f-skill"></select></label>
          <label id="f-level-wrap">Level<select id="f-level"></select></label>
          <label>検索<input type="text" id="f-q" placeholder="本文・設問の言葉"></label>
        </div>
        <div class="listbar">
          <span id="shown"></span>
          <span class="rand"><button type="button" class="btn" id="sel-rand">ランダムに</button><input type="number" id="rand-n" value="5" min="1" max="30" aria-label="ランダムに選ぶ数">問選ぶ</span>
          <button type="button" class="btn" id="sel-all">全部選ぶ</button>
          <button type="button" class="btn" id="sel-clear">選択を外す</button>
        </div>
        <div class="list" id="list"></div>
      </section>
      <aside class="side">
        <div class="panel countbox">
          <h2>選んだ問題</h2>
          <div><span class="count" id="count">0</span> 問</div>
          <div class="small" id="count-detail"></div>
        </div>
        <div class="panel opt">
          <h2>プリントの作り方</h2>
          <label class="name" for="p-title">プリントの名前<input type="text" id="p-title" value="読解トレーニング"></label>
          <div class="modes">
            <label><input type="radio" name="mode" value="self" checked><span>自力で解く<small>問題だけのプリント</small></span></label>
            <label><input type="radio" name="mode" value="guided"><span>自力 → 誘導 → 再挑戦<small>解いたあと、読み方の誘導で確かめてもう一度解く</small></span></label>
          </div>
          <div class="outs">
            <label><input type="checkbox" id="o-q" checked> 問題</label>
            <label><input type="checkbox" id="o-a" checked> 解答（赤字）</label>
            <label><input type="checkbox" id="o-k" checked> 解説</label>
          </div>
          <button type="button" class="btn primary" id="make">プリントを作る</button>
          <div class="small">作ったプリントは、このページの下に表示されます。</div>
        </div>
      </aside>
    </div>
  </div>
</div>
<div id="mbar"><span class="c"><b id="mcount">0</b> 問を選択中</span><button type="button" class="btn primary" id="mmake">プリントを作る</button></div>
<div id="out-bar" hidden>
  <span id="out-info"></span>
  <button type="button" class="btn" id="do-print">印刷する</button>
  <span class="small">A4・横向き／余白なし／倍率100％／背景のグラフィックをオン</span>
  <span class="warn" id="out-warn"></span>
</div>
<main class="sheets" id="sheets"></main>

<script src="assets/js/yomi.js"></script>
<script src="data/stages.js"></script>
<script src="data/stage0.js"></script>
<script src="data/stage1.js"></script>
<script src="data/stage2.js"></script>
<script src="data/stage3.js"></script>
<script src="data/stage4.js"></script>
<script src="data/stage5.js"></script>
<script src="data/stage6.js"></script>
<script src="data/stage7.js"></script>
<script src="data/bank.js"></script>
<script src="data/bank-plus.js"></script>
<script src="assets/js/practice.js"></script>
<script src="assets/js/bank.js"></script>
<script src="assets/js/fit.js"></script>
</body>
</html>
