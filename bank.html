<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習問題｜読解ステップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/sheet.css">
<style>
  :root { --ui-ink: #1f2328; --ui-sub: #59636e; --ui-line: #d1d9e0; --ui-bg: #f6f8fa; --ui-card: #fff; --ui-accent: #2f6fd6; --ui-sel: #eaf2ff; }
  body.bank { background: var(--ui-bg); }
  .ui { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; color: var(--ui-ink); line-height: 1.6; }
  .ui header { background: var(--ui-ink); color: #fff; padding: 18px 16px; }
  .ui header .in, .ui .wrap { max-width: 1100px; margin: 0 auto; }
  .ui header a { color: #9cc8ff; text-decoration: none; font-size: 14px; }
  .ui h1 { margin: 4px 0 2px; font-size: 22px; }
  .ui header p { margin: 0; color: #c9d1d9; font-size: 13px; }
  .ui .wrap { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  .ui .panel { background: var(--ui-card); border: 1px solid var(--ui-line); border-radius: 8px; padding: 14px; }
  .ui .side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .ui .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .ui .tabs button { font: inherit; padding: 6px 14px; border: 1px solid var(--ui-line); border-radius: 999px; background: #fff; cursor: pointer; }
  .ui .tabs button[aria-pressed="true"] { background: var(--ui-ink); color: #fff; border-color: var(--ui-ink); }
  .ui .filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; margin-bottom: 10px; font-size: 13px; }
  .ui .filters label { display: flex; flex-direction: column; gap: 2px; color: var(--ui-sub); }
  .ui select, .ui input[type="text"], .ui input[type="number"] { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--ui-line); border-radius: 6px; background: #fff; color: var(--ui-ink); }
  .ui .listbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ui-sub); margin-bottom: 8px; }
  .ui .btn { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--ui-line); border-radius: 6px; background: #fff; cursor: pointer; color: var(--ui-ink); }
  .ui .btn.primary { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); font-weight: 700; font-size: 15px; padding: 9px 14px; width: 100%; }
  .ui .btn:focus-visible, .ui .tabs button:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
  .ui .list { display: flex; flex-direction: column; gap: 6px; }
  .ui .item { border: 1px solid var(--ui-line); border-radius: 6px; background: #fff; }
  .ui .item.on { background: var(--ui-sel); border-color: var(--ui-accent); }
  .ui .item .row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; }
  .ui .item input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
  .ui .item .meta { font-size: 12px; color: var(--ui-sub); }
  .ui .item .qtext { font-size: 14px; min-width: 0; }
  .ui .item details { padding: 0 10px 8px 38px; font-size: 13px; }
  .ui .item summary { cursor: pointer; color: var(--ui-accent); }
  .ui .item .pv { white-space: pre-wrap; background: var(--ui-bg); padding: 8px; border-radius: 4px; margin: 6px 0; max-height: 260px; overflow: auto; }
  .ui .stage-row select { font-size: 15px; font-weight: 700; }
  .ui .stage-info { background: var(--ui-bg); border: 1px solid var(--ui-line); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .ui .stage-info p { margin: 4px 0 0; }
  .ui .stage-info a { color: var(--ui-accent); text-decoration: none; white-space: nowrap; }
  .ui .tag.st { background: var(--ui-ink); color: #fff; }
  .ui .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: #eef1f4; margin-right: 4px; }
  .ui .side h2 { font-size: 15px; margin: 0 0 8px; }
  .ui .side .count { font-size: 26px; font-weight: 700; }
  .ui .opt { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .ui .opt label { display: flex; gap: 6px; align-items: flex-start; }
  .ui .small { font-size: 12px; color: var(--ui-sub); }
  .ui .empty { padding: 20px; text-align: center; color: var(--ui-sub); }
  #out-bar { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 12px 16px; background: var(--ui-ink); color: #fff; }
  #out-bar .btn { background: var(--ui-accent); color: #fff; border: 0; font-weight: 700; }
  #out-bar .warn { color: #ffb4b4; }
  @media (max-width: 820px) { .ui .wrap { grid-template-columns: minmax(0, 1fr); } .ui .side { position: static; } }
  @media print { .ui, #out-bar { display: none !important; } body.bank { background: none; } }
</style>
</head>
<body class="bank">
<div class="ui">
  <header><div class="in">
    <a href="index.html">← ステージ一覧へ</a>
    <h1>練習問題</h1>
    <p>各ステージで解き方を学んだあとに、同じ技能の問題をくり返し練習するためのページです。ステージを選ぶと、そのステージの練習になる問題だけが出ます。</p>
  </div></header>
  <div class="wrap">
    <section class="panel">
      <div class="filters stage-row">
        <label>ステージ<select id="f-stage"></select></label>
      </div>
      <div class="stage-info" id="stage-info" hidden></div>
      <div class="tabs" role="group" aria-label="問題の種類">
        <button type="button" data-kind="skill" aria-pressed="true">技能別の問題</button>
        <button type="button" data-kind="big" aria-pressed="false">長文大問</button>
        <button type="button" data-kind="kaizen" aria-pressed="false">答案改善</button>
      </div>
      <div class="filters">
        <label id="f-skill-wrap">技能<select id="f-skill"></select></label>
        <label id="f-level-wrap">Level<select id="f-level"></select></label>
        <label>検索<input type="text" id="f-q" placeholder="本文・設問の言葉"></label>
      </div>
      <div class="listbar">
        <span id="shown"></span>
        <button type="button" class="btn" id="sel-all">表示中を全部選ぶ</button>
        <button type="button" class="btn" id="sel-rand">表示中からランダムに</button>
        <input type="number" id="rand-n" value="5" min="1" max="30" aria-label="ランダムに選ぶ数" style="width:4.5em">問
        <button type="button" class="btn" id="sel-clear">選択を全部外す</button>
      </div>
      <div class="list" id="list"></div>
    </section>
    <aside class="side">
      <div class="panel">
        <h2>選んだ問題</h2>
        <div><span class="count" id="count">0</span> 問</div>
        <div class="small" id="count-detail"></div>
      </div>
      <div class="panel opt">
        <h2>プリントの作り方</h2>
        <label for="p-title" style="flex-direction:column;gap:2px">プリントの名前<input type="text" id="p-title" value="読解トレーニング"></label>
        <label><input type="radio" name="mode" value="self" checked> 自力で解く（問題だけ）</label>
        <label><input type="radio" name="mode" value="guided"> 自力 → 読み方の誘導 → 再挑戦</label>
        <div class="small">「自力→誘導→再挑戦」は、まず誘導なしで答え、次に誘導にそって読み直し、最後に同じ問題をもう一度解く形です。</div>
        <hr style="border:0;border-top:1px solid var(--ui-line);width:100%">
        <label><input type="checkbox" id="o-q" checked> 問題</label>
        <label><input type="checkbox" id="o-a" checked> 解答（赤字入り）</label>
        <label><input type="checkbox" id="o-k" checked> 解説</label>
        <button type="button" class="btn primary" id="make">プリントを作る</button>
        <div class="small">作ったプリントは、このページの下に表示されます。</div>
      </div>
    </aside>
  </div>
</div>
<div id="out-bar" hidden>
  <span id="out-info"></span>
  <button type="button" class="btn" id="do-print">印刷する</button>
  <span class="small">A4・横向き／余白なし／倍率100％／背景のグラフィックをオン</span>
  <span class="warn" id="out-warn"></span>
</div>
<main class="sheets" id="sheets"></main>

<script src="assets/js/yomi.js"></script>
<script src="data/stages.js"></script>
<script src="data/stage0.js"></script>
<script src="data/stage1.js"></script>
<script src="data/stage2.js"></script>
<script src="data/stage3.js"></script>
<script src="data/stage4.js"></script>
<script src="data/stage5.js"></script>
<script src="data/stage6.js"></script>
<script src="data/stage7.js"></script>
<script src="data/bank.js"></script>
<script src="data/bank-plus.js"></script>
<script src="assets/js/practice.js"></script>
<script src="assets/js/bank.js"></script>
</body>
</html>
